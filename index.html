<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Home</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --ninho-gold: #fbb000;
            --ninho-bg: #f9f9f7;
            --text-main: #2d2d2d;
            --text-muted: #8e8e93;
            --success-green: #34c759;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--ninho-bg); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .app-shell { width: 100%; max-width: 420px; height: 100dvh; background: var(--ninho-bg); display: flex; flex-direction: column; position: relative; overflow: hidden; }

        /* LOGIN SCREEN - REPLICANDO SUA IMAGEM */
        #login-screen {
            position: absolute; inset: 0; z-index: 5000;
            background: linear-gradient(rgba(255,251,242,0.8), rgba(255,251,242,0.95)), url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?q=80&w=2000');
            background-size: cover; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 60px;
        }
        .login-card { background: white; width: 100%; height: 100%; border-radius: 40px 40px 0 0; padding: 40px 30px; margin-top: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .input-ninho { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 15px; outline: none; }
        .btn-entrar { width: 100%; padding: 18px; border-radius: 15px; background: var(--ninho-gold); color: white; border: none; font-weight: 800; cursor: pointer; }

        /* DASHBOARD */
        .card-saldo { margin: 20px; padding: 25px; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); text-align: center; }
        .chart-box { position: relative; width: 200px; height: 110px; margin: 0 auto; display: flex; justify-content: center; align-items: flex-end; }
        .gauge-svg { width: 100%; height: 100%; }
        .gauge-bg { fill: none; stroke: #f0f0f0; stroke-width: 10; stroke-linecap: round; }
        .gauge-fill { fill: none; stroke: var(--ninho-gold); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 251; stroke-dashoffset: 251; transition: stroke-dashoffset 2s ease; }
        
        .footer-tabs { position: absolute; bottom: 0; width: 100%; height: 85px; background: white; display: flex; justify-content: space-around; align-items: center; padding-bottom: 25px; border-top: 1px solid #f1f1f1; z-index: 1000; }
        .tab-btn { text-align: center; color: #b2bec3; font-size: 0.65rem; font-weight: 700; cursor: pointer; }
        .tab-btn.active { color: var(--ninho-gold); }
        .center-btn { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: var(--ninho-gold); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; box-shadow: 0 8px 20px rgba(251, 176, 0, 0.4); z-index: 1100; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div id="login-screen">
            <h1 style="font-weight: 800; color: #444;">nosso ninho</h1>
            <div class="login-card">
                <h2 style="margin-bottom: 10px;">Bem-vindo de volta!</h2>
                <input type="email" id="login-email" class="input-ninho" placeholder="E-mail">
                <input type="password" id="login-pass" class="input-ninho" placeholder="Senha">
                <button class="btn-entrar" onclick="login()">Entrar</button>
                <p id="login-error" style="color:red; font-size:0.7rem; margin-top:10px; text-align:center;"></p>
            </div>
        </div>

        <div id="tab-ninho" class="tab-content active" style="display:flex; flex-direction:column; height:100%;">
            <div style="padding: 50px 20px 10px;">
                <h2 id="welcome-msg">Olá! 👋</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;">Vamos construir seu <span style="color:var(--ninho-gold); font-weight:700;">novo lar!</span></p>
            </div>

            <div class="card-saldo">
                <div class="chart-box">
                    <svg class="gauge-svg" viewBox="0 0 100 50">
                        <path class="gauge-bg" d="M10,45 A35,35 0 0,1 90,45" />
                        <path id="global-arc" class="gauge-fill" d="M10,45 A35,35 0 0,1 90,45" />
                    </svg>
                    <div id="global-perc" style="position:absolute; bottom:0; font-weight:800; font-size:1.5rem;">0%</div>
                </div>
                <h2 id="total" style="font-size: 1.8rem; margin-top: 10px;">R$ 0,00</h2>
                <p style="font-size:0.75rem; color:var(--success-green); font-weight:700;">📈 + R$ <span id="cdi-val">0,00</span> (CDI 115%)</p>
            </div>

            <div id="activity-log" style="flex:1; padding: 10px 20px; overflow-y:auto; margin-bottom: 90px;"></div>
        </div>

        <div class="center-btn" onclick="showModal('add')">＋</div>

        <div class="footer-tabs">
            <div class="tab-btn active" onclick="switchTab('ninho', this)">Início</div>
            <div style="width: 60px;"></div>
            <div class="tab-btn" onclick="logout()">Sair</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                conectarFirebase();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        function login() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => document.getElementById('login-error').innerText = "Erro de acesso.");
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function conectarFirebase() {
            auth.currentUser.getIdToken().then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`)
                .then(res => res.json()).then(data => { if(data) { dadosApp = data; atualizarInterface(); } });
            });
            setTimeout(conectarFirebase, 5000);
        }

        function atualizarInterface() {
            const totalVal = (dadosApp.saldoG || 0) + (dadosApp.saldoF || 0);
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('cdi-val').innerText = (totalVal * 0.0095).toLocaleString('pt-BR', {minimumFractionDigits: 2});
            
            const perc = Math.min((totalVal / 100000 * 100), 100);
            document.getElementById('global-arc').style.strokeDashoffset = 251 - (251 * (perc / 100));
            document.getElementById('global-perc').innerText = Math.floor(perc) + '%';
        }
    </script>
</body>
</html>
