<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Premium</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --ninho-gold: #fbb000;
            --ninho-bg: #f9f9f7;
            --text-main: #2d2d2d;
            --text-muted: #8e8e93;
            --success-green: #34c759;
            --danger-red: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--ninho-bg); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        #splash-screen { position: absolute; inset: 0; z-index: 9000; background: var(--ninho-bg); display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        #login-screen { position: absolute; inset: 0; z-index: 5000; background: white; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }

        .app-shell { width: 100%; max-width: 420px; height: 100dvh; background: var(--ninho-bg); display: flex; flex-direction: column; position: relative; opacity: 0; transition: opacity 0.5s ease; }

        .top-nav { padding: 45px 20px 10px; display: flex; justify-content: flex-end; align-items: center; }
        .btn-alerta { font-size: 1.5rem; cursor: pointer; background: none; border: none; }

        .tab-content { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 110px; scroll-behavior: smooth; }
        .tab-content.active { display: flex; }

        .welcome-section { padding: 10px 20px 10px; text-align: center; }
        .welcome-section b { color: var(--ninho-gold); text-transform: capitalize; }

        .card-saldo { margin: 0 20px 15px; padding: 20px; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); text-align: center; }
        .chart-box { position: relative; width: 160px; height: 85px; margin: 0 auto; display: flex; justify-content: center; align-items: flex-end; }
        
        .gauge-svg { width: 100%; height: 100%; overflow: visible; }
        .gauge-bg { fill: none; stroke: #f0f0f0; stroke-width: 10; stroke-linecap: round; }
        .gauge-fill { fill: none; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 126; stroke-dashoffset: 126; transition: stroke-dashoffset 1.2s ease-out; }
        
        .users-row { display: flex; gap: 10px; padding: 0 20px 15px; }
        .user-mini-card { flex: 1; background: white; padding: 15px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .user-mini-card img { width: 45px; height: 45px; border-radius: 50%; margin-bottom: 5px; object-fit: cover; border: 2px solid #f8f8f8; }
        .meta-tag { font-size: 0.55rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        .actions-row { display: flex; gap: 12px; padding: 0 20px 20px; }
        .btn-action { flex: 1; padding: 16px; border-radius: 18px; border: none; font-weight: 800; font-size: 0.8rem; cursor: pointer; }

        .log-container { padding: 0 20px; text-align: center; }
        .log-row { padding: 10px 0; border-bottom: 1px solid #f1f1f1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .footer-tabs { position: absolute; bottom: 0; width: 100%; height: 85px; background: white; display: flex; justify-content: space-around; align-items: center; padding-bottom: 25px; border-top: 1px solid #f1f1f1; z-index: 1000; }
        .tab-btn { text-align: center; color: #b2bec3; font-size: 0.65rem; font-weight: 700; cursor: pointer; }
        .tab-btn.active { color: var(--ninho-gold); }

        #modal { position: absolute; inset: 0; z-index: 6000; background: rgba(0,0,0,0.1); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; padding: 30px; }

        .break-effect { position: fixed; inset: 0; pointer-events: none; z-index: 9999; display: none; }
        .crack { position: absolute; background: rgba(0,0,0,0.4); transform: rotate(var(--r)); width: 2px; height: var(--h); top: var(--y); left: var(--x); animation: crackFade 0.8s forwards; }
        @keyframes crackFade { 0% { opacity: 1; } 100% { opacity: 0; height: calc(var(--h) * 1.5); } }
    </style>
</head>
<body>
    <div id="break-overlay" class="break-effect"></div>
    <div id="splash-screen"><h2 style="font-weight: 800; color: var(--ninho-gold);">nosso ninho</h2></div>

    <div id="login-screen">
        <h1 style="margin-bottom: 20px; font-weight: 800;">nosso ninho</h1>
        <input type="email" id="login-email" style="width:100%; padding:15px; margin-bottom:10px; border-radius:15px; border:1px solid #ddd;" placeholder="E-mail">
        <input type="password" id="login-pass" style="width:100%; padding:15px; margin-bottom:20px; border-radius:15px; border:1px solid #ddd;" placeholder="Senha">
        <button onclick="login()" style="width:100%; padding:18px; border-radius:15px; background:var(--ninho-gold); color:white; border:none; font-weight:800;">Entrar</button>
    </div>

    <div class="app-shell" id="app-shell">
        <div class="top-nav"><button class="btn-alerta" onclick="mostrarMotivacao()">🔔</button></div>
        
        <div id="tab-ninho" class="tab-content active">
            <div class="welcome-section"><h2>Olá, <b id="user-name">Usuário</b> 👋</h2><p>Construindo nosso <span>novo lar!</span></p></div>
            <div class="card-saldo">
                <div class="meta-tag">Meta do nosso ninho: R$ 100.000</div>
                <div class="chart-box">
                    <svg class="gauge-svg" viewBox="0 0 100 50">
                        <path class="gauge-bg" d="M10,45 A40,40 0 0,1 90,45" />
                        <path id="global-arc" class="gauge-fill" style="stroke:var(--ninho-gold)" d="M10,45 A40,40 0 0,1 90,45" />
                    </svg>
                    <div id="global-perc" style="position:absolute; bottom:0; font-weight:800; font-size:1.2rem;">0%</div>
                </div>
                <h2 id="total" style="font-size: 1.6rem; margin-top: 5px;">R$ 0,00</h2>
                <div style="font-size: 0.7rem; color: var(--success-green); font-weight: 700;">📈 + R$ <span id="cdi-val">0,00</span> (115% CDI)</div>
            </div>
            <div class="users-row">
                <div class="user-mini-card">
                    <img src="foto-gabriel.png" onerror="this.src='https://ui-avatars.com/api/?name=Gabriel&background=fbb000&color=fff'">
                    <b>Gabriel</b><div class="meta-tag">Meta: 50K</div>
                    <div class="chart-box" style="width:70px; height:35px;">
                        <svg class="gauge-svg" viewBox="0 0 100 50">
                            <path class="gauge-bg" d="M10,45 A40,40 0 0,1 90,45" />
                            <path id="arc-g" class="gauge-fill" style="stroke:#34c759" d="M10,45 A40,40 0 0,1 90,45" />
                        </svg>
                    </div>
                    <span id="val-g" style="font-size:0.7rem; font-weight:800;">R$ 0</span>
                </div>
                <div class="user-mini-card">
                    <img src="foto-fernando.png" onerror="this.src='https://ui-avatars.com/api/?name=Fernando&background=fbb000&color=fff'">
                    <b>Fernando</b><div class="meta-tag">Meta: 50K</div>
                    <div class="chart-box" style="width:70px; height:35px;">
                        <svg class="gauge-svg" viewBox="0 0 100 50">
                            <path class="gauge-bg" d="M10,45 A40,40 0 0,1 90,45" />
                            <path id="arc-f" class="gauge-fill" style="stroke:#007aff" d="M10,45 A40,40 0 0,1 90,45" />
                        </svg>
                    </div>
                    <span id="val-f" style="font-size:0.7rem; font-weight:800;">R$ 0</span>
                </div>
            </div>
            <div class="actions-row">
                <button class="btn-action" style="background:#2d2d2d; color:white;" onclick="showModal('add')">TIJOLOS 🧱</button>
                <button class="btn-action" style="background:white; color:var(--danger-red); border:1px solid #eee;" onclick="confirmDemolish()">DEMOLIR 🔨</button>
            </div>
            <div class="log-container" id="activity-log"></div>
        </div>

        <div id="tab-pandora" class="tab-content">
            <div class="welcome-section"><h2>Cofre Pandora</h2><p>Meta: <span>R$ 5.000</span></p></div>
            <div class="card-saldo">
                <h2 id="pandora-status" style="font-size: 1.5rem;">R$ 0,00</h2>
                <div style="height:8px; background:#f0f0f0; border-radius:10px; margin-top:10px; overflow:hidden;"><div id="pandora-progress" style="height:100%; width:0%; background:var(--success-green); transition:1s;"></div></div>
            </div>
            <div id="grid-container" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(42px, 1fr)); gap:8px; padding:20px;"></div>
        </div>

        <div class="footer-tabs">
            <div class="tab-btn active" id="btn-ninho" onclick="switchTab('ninho', this)"><i>🏠</i>Ninho</div>
            <div class="tab-btn" id="btn-pandora" onclick="switchTab('pandora', this)"><i>🎁</i>Cofre</div>
            <div class="tab-btn" onclick="logout()"><i>🚪</i>Sair</div>
        </div>

        <div id="modal">
            <div style="background:white; width:85%; padding:30px; border-radius:30px; text-align:center;">
                <h3 id="modal-title">Operação</h3>
                <input type="number" id="input-val" style="width:100%; border:none; border-bottom:2px solid #eee; font-size:2rem; text-align:center; margin:20px 0; outline:none;" placeholder="0" inputmode="decimal">
                <div style="display:flex; gap:10px;">
                    <button style="flex:2; padding:15px; border-radius:15px; background:var(--ninho-gold); color:white; border:none; font-weight:800;" onclick="processar()">Confirmar</button>
                    <button style="flex:1; padding:15px; border-radius:15px; background:#eee; border:none;" onclick="hideModal()">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentMode = 'add';
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };
        
        const frases = [
            "Continue que a casa tá ficando pronta! 🏠",
            "Cada tijolo é um passo mais perto do nosso sonho! ✨",
            "Nosso ninho está crescendo a cada dia! 🐥",
            "Orgulho do que estamos construindo juntos! ❤️",
            "Foco na meta, o futuro nos espera! 🚀",
            "Mais um tijolo, menos um dia de espera! 🧱",
            "Onde há amor e foco, há um lar sendo feito! 👷‍♂️",
            "A fundação está sólida, falta pouco para o telhado! 🏗️",
            "Nossa disciplina hoje é o conforto de amanhã! ☕",
            "Nada vence a nossa união rumo aos 100k! 💪",
            "Quem planeja, realiza. Estamos no caminho certo! 📍",
            "A paz de um lar próprio não tem preço. Avante! 🌅",
            "Tijolo por tijolo, estamos escrevendo nossa história! 📖",
            "O esforço é temporário, a casa é para sempre! 🌳",
            "Vocês são um time imbatível. Mantenham o ritmo! 👫"
        ];

        const rawValues = [...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20), ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)];
        const pandoraValues = rawValues.sort((a,b) => b-a);

        auth.onAuthStateChanged(user => { 
            const splash = document.getElementById('splash-screen');
            const login = document.getElementById('login-screen');
            const app = document.getElementById('app-shell');
            if (user) { 
                const name = user.email.includes('fernando') ? 'Fernando' : 'Gabriel';
                document.getElementById('user-name').innerText = name;
                conectarFirebase().then(() => {
                    login.style.display = 'none';
                    app.style.opacity = '1';
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 400);
                });
            } else { 
                login.style.display = 'flex'; 
                app.style.opacity = '0';
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            } 
        });

        function mostrarMotivacao() { alert(frases[Math.floor(Math.random() * frases.length)]); }
        function login() { const e = document.getElementById('login-email').value; const p = document.getElementById('login-pass').value; auth.signInWithEmailAndPassword(e, p).catch(() => alert("Erro de acesso.")); }
        function logout() { auth.signOut().then(() => location.reload()); }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            if(el) el.classList.add('active');
        }

        async function conectarFirebase() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`);
            const data = await res.json();
            if(data) { dadosApp = data; atualizarInterface(); }
            setTimeout(conectarFirebase, 6000);
        }

        function triggerBreak() {
            const overlay = document.getElementById('break-overlay');
            overlay.innerHTML = ''; overlay.style.display = 'block';
            for(let i=0; i<15; i++){
                const crack = document.createElement('div');
                crack.className = 'crack';
                crack.style.setProperty('--x', Math.random()*100 + '%');
                crack.style.setProperty('--y', Math.random()*100 + '%');
                crack.style.setProperty('--r', Math.random()*360 + 'deg');
                crack.style.setProperty('--h', (Math.random()*100 + 50) + 'px');
                overlay.appendChild(crack);
            }
            setTimeout(() => overlay.style.display = 'none', 800);
        }

        function confirmDemolish() { if(confirm("Atenção! Deseja mesmo demolir uma parte da casa?")) { showModal('remove'); } }

        function processar() {
            const input = document.getElementById('input-val');
            let v = parseFloat(input.value);
            if(isNaN(v) || v === 0) return;
            const user = auth.currentUser.email.includes('fernando') ? 'Fernando' : 'Gabriel';
            
            if(currentMode === 'remove') { v = -v; triggerBreak(); } 
            else { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fbb000', '#ffffff'] }); }
            
            if(user === 'Gabriel') dadosApp.saldoG += v; else dadosApp.saldoF += v;
            
            registrarAtividade(user, v, "Ninho");
            atualizarInterface();
            input.value = '';
            salvar();
        }

        function togglePandora(index) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const pos = dadosApp.pandora.indexOf(index);
            const user = auth.currentUser.email.includes('fernando') ? 'Fernando' : 'Gabriel';
            const val = pandoraValues[index];
            if(pos > -1) {
                if(confirm(`Deseja retirar R$ ${val} do cofre?`)) {
                    dadosApp.pandora.splice(pos, 1);
                    registrarAtividade(user, -val, "Cofre");
                    triggerBreak();
                    atualizarInterface();
                    salvar();
                }
            } else {
                dadosApp.pandora.push(index);
                confetti({ particleCount: 50, spread: 50, origin: { y: 0.8 }, colors: ['#34c759', '#ffffff'] });
                registrarAtividade(user, val, "Cofre");
                atualizarInterface();
                salvar();
            }
        }

        function registrarAtividade(user, val, local) {
            if(!dadosApp.historico) dadosApp.historico = [];
            dadosApp.historico.unshift({ user, val, local, date: new Date().toLocaleDateString('pt-BR'), time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) }).then(() => hideModal());
            });
        }

        function atualizarInterface() {
            const sG = dadosApp.saldoG || 0; 
            const sF = dadosApp.saldoF || 0; 
            const totalVal = sG + sF;
            
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('val-g').innerText = 'R$ ' + sG.toLocaleString('pt-BR');
            document.getElementById('val-f').innerText = 'R$ ' + sF.toLocaleString('pt-BR');
            document.getElementById('cdi-val').innerText = (totalVal * 0.0095).toLocaleString('pt-BR', {minimumFractionDigits: 2});
            
            const arcLength = 126;

            // Meta Geral (100k)
            const percGlobal = (totalVal / 100000);
            document.getElementById('global-arc').style.strokeDashoffset = arcLength - (arcLength * Math.min(percGlobal, 1));
            document.getElementById('global-perc').innerText = Math.floor(Math.min(percGlobal * 100, 100)) + '%';

            // Meta Individual Gabriel (50k)
            const percG = (sG / 50000);
            document.getElementById('arc-g').style.strokeDashoffset = arcLength - (arcLength * Math.min(percG, 1));

            // Meta Individual Fernando (50k)
            const percF = (sF / 50000);
            document.getElementById('arc-f').style.strokeDashoffset = arcLength - (arcLength * Math.min(percF, 1));

            const container = document.getElementById('grid-container'); let totalP = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const active = (dadosApp.pandora || []).includes(i); if(active) totalP += v;
                return `<div class="tile" onclick="togglePandora(${i})" style="aspect-ratio:1; background:${active ? 'var(--ninho-gold)' : 'white'}; color:${active ? '#fff' : '#aaa'}; border-radius:8px; display:flex; align-items:center; justify-content:center;">${v}</div>`;
            }).join('');
            document.getElementById('pandora-status').innerText = 'R$ ' + totalP.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('pandora-progress').style.width = (totalP / 5000 * 100) + '%';
            document.getElementById('activity-log').innerHTML = (dadosApp.historico || []).slice(0,4).map(i => `
                <div class="log-row"><b>${i.val > 0 ? 'Colocou' : 'Demoliu'} tijolos no ${i.local} - ${i.user}</b>
                <div class="log-val" style="color:${i.val > 0 ? 'var(--success-green)' : 'var(--danger-red)'}">${i.val > 0 ? '+' : ''} R$ ${Math.abs(i.val).toLocaleString('pt-BR')}</div>
                <small>${i.date} às ${i.time}</small></div>`).join('');
        }

        function showModal(mode) { 
            currentMode = mode; 
            document.getElementById('modal-title').innerText = mode === 'remove' ? "DEMOLIR TIJOLO 🔨" : "COLOCAR TIJOLO 🧱"; 
            document.getElementById('modal').style.display = 'flex'; 
            document.getElementById('input-val').value = '';
            document.getElementById('input-val').focus(); 
        }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
