<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Premium</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg: #f8f9fd;
            --primary: #ffafcc;
            --secondary: #a2d2ff;
            --accent: #bde0fe;
            --success: #74c69d;
            --danger: #ff8fa3;
            --text: #2d3436;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: var(--text); }

        /* Container Principal */
        .app-container {
            width: 100%; max-width: 414px; height: 100dvh;
            background: #fff; position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        /* Login Renovado */
        #login-screen {
            position: absolute; inset: 0; z-index: 5000;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
        }
        .login-box {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 30px; width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;
        }

        /* Header */
        .header { padding: 40px 25px 20px; text-align: left; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text); }
        .header p { font-size: 0.85rem; color: #b2bec3; font-weight: 400; }

        /* Dashboard */
        .main-card {
            margin: 0 20px; padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #ffc8dd 100%);
            border-radius: 35px; color: white; text-align: center;
            box-shadow: 0 15px 35px rgba(255, 175, 204, 0.3);
        }
        .main-card h2 { font-size: 2.2rem; margin: 10px 0; letter-spacing: -1px; }

        /* Cards de Usuário */
        .user-row { display: flex; gap: 15px; padding: 25px 20px; }
        .u-card {
            flex: 1; background: #fff; padding: 15px; border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid #f1f2f6;
        }
        .avatar { width: 50px; height: 50px; border-radius: 18px; margin-bottom: 10px; object-fit: cover; }
        .u-card span { font-weight: 700; font-size: 0.9rem; }

        /* Barra de Progresso Custom */
        .p-bar { width: 100%; height: 6px; background: #f1f2f6; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .p-fill { height: 100%; width: 0%; transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* Atividades */
        .section-title { padding: 0 25px; font-size: 0.9rem; font-weight: 700; color: #b2bec3; margin-bottom: 10px; }
        .log-container { flex: 1; padding: 0 25px; overflow-y: auto; }
        .log-item {
            background: #fff; padding: 12px 15px; border-radius: 18px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01); border-left: 4px solid var(--secondary);
        }

        /* Botões */
        .actions { display: flex; gap: 12px; padding: 20px 25px 100px; }
        .btn {
            flex: 1; padding: 18px; border-radius: 20px; border: none;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.3s;
        }
        .btn-build { background: var(--text); color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-demo { background: #fff; color: var(--danger); border: 2px solid #fff3f5; }

        /* Pandora Grid */
        .pandora-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            gap: 8px; padding: 20px;
        }
        .p-item {
            aspect-ratio: 1; background: #fff; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 700; color: #dfe6e9;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02); cursor: pointer;
        }
        .p-item.active { background: var(--success); color: white; transform: scale(1.1); box-shadow: 0 5px 15px rgba(116, 198, 157, 0.3); }

        /* Tab Bar */
        .nav {
            position: absolute; bottom: 0; width: 100%; height: 80px;
            background: var(--glass); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #f1f2f6; padding-bottom: 15px;
        }
        .nav-item { text-align: center; color: #b2bec3; font-size: 0.7rem; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 1.4rem; margin-bottom: 4px; font-style: normal; }

        /* Modal */
        #modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 6000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: white; width: 100%; border-radius: 35px; padding: 30px;
            text-align: center; animation: slideUp 0.4s ease;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="login-screen">
            <div class="login-box">
                <h1 style="font-family:'Playfair Display'; margin-bottom:10px;">Nosso Ninho</h1>
                <p style="margin-bottom:25px; color:#b2bec3;">Bem-vindo ao seu porto seguro</p>
                <input type="email" id="login-email" class="btn" style="background:#f1f2f6; margin-bottom:10px; width:100%; text-align:center;" placeholder="E-mail">
                <input type="password" id="login-pass" class="btn" style="background:#f1f2f6; margin-bottom:20px; width:100%; text-align:center;" placeholder="Senha">
                <button class="btn btn-build" onclick="login()" style="width:100%">Entrar no Ninho</button>
                <p id="login-error" style="color:var(--danger); font-size:0.7rem; margin-top:15px;"></p>
            </div>
        </div>

        <div id="tab-ninho" class="tab-content active" style="display:flex; flex-direction:column; height:100%;">
            <div class="header">
                <p id="welcome-msg">Carregando...</p>
                <h1>Painel da Construção</h1>
            </div>

            <div class="main-card">
                <p style="font-size:0.8rem; opacity:0.9; font-weight:700;">SALDO TOTAL DO NINHO</p>
                <h2 id="total">R$ 0</h2>
                <div style="font-size:0.7rem; opacity:0.8;">Meta de R$ 100.000</div>
            </div>

            <div class="user-row">
                <div class="u-card">
                    <img src="foto-gabriel.png" class="avatar" style="border: 2px solid var(--secondary)">
                    <span>R$ <small id="val-g">0</small></span>
                    <div class="p-bar"><div id="bar-g" class="p-fill" style="background:var(--secondary)"></div></div>
                </div>
                <div class="u-card">
                    <img src="foto-fernando.png" class="avatar" style="border: 2px solid var(--primary)">
                    <span>R$ <small id="val-f">0</small></span>
                    <div class="p-bar"><div id="bar-f" class="p-fill" style="background:var(--primary)"></div></div>
                </div>
            </div>

            <p class="section-title">ATIVIDADES RECENTES</p>
            <div id="activity-log" class="log-container"></div>

            <div class="actions">
                <button class="btn btn-build" onclick="showModal('add')">CONSTRUIR 🧱</button>
                <button class="btn btn-demo" onclick="showModal('remove')">DEMOLIR 🔨</button>
            </div>
        </div>

        <div id="tab-pandora" class="tab-content" style="display:none; flex-direction:column; height:100%;">
            <div class="header">
                <p>OBJETIVO ESPECIAL</p>
                <h1>Caixa de Pandora</h1>
            </div>
            <div style="margin: 0 25px 20px; background:var(--success); padding:20px; border-radius:25px; color:white; text-align:center;">
                <h3 id="pandora-status">R$ 0</h3>
                <p style="font-size:0.7rem; opacity:0.8;">Progresso até R$ 5.000</p>
                <div class="p-bar" style="background:rgba(255,255,255,0.2); height:10px;"><div id="pandora-bar" class="p-fill" style="background:#fff"></div></div>
            </div>
            <div id="grid-container" class="pandora-grid"></div>
        </div>

        <div class="nav">
            <div class="nav-item active" id="nav-home" onclick="switchTab('ninho', this)"><i>🏠</i>Ninho</div>
            <div class="nav-item" id="nav-gift" onclick="switchTab('pandora', this)"><i>🎁</i>Pandora</div>
            <div class="nav-item" onclick="logout()"><i>🚪</i>Sair</div>
        </div>

        <div id="modal">
            <div class="modal-content">
                <h3 id="modal-title" style="margin-bottom:20px;">Adicionar</h3>
                <input type="number" id="input-val" class="btn" style="background:#f1f2f6; width:100%; text-align:center; font-size:1.5rem; margin-bottom:20px;" placeholder="0,00">
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-build" onclick="processar()" id="btn-confirmar">Confirmar</button>
                    <button class="btn" style="background:#f1f2f6; color:#b2bec3" onclick="hideModal()">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentMode = 'add'; 

        const rawValues = [
            ...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20),
            ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)
        ];
        const pandoraValues = rawValues.sort(() => 0.5 - Math.random());

        let currentUser = null;
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                currentUser = user.email.toLowerCase().includes('fernando') ? 'Fernando' : 'Gabriel';
                document.getElementById('welcome-msg').innerText = `Olá, ${currentUser} 👋`;
                conectarFirebase();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        function login() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            if(!e || !p) return;
            auth.signInWithEmailAndPassword(e, p).catch(() => {
                document.getElementById('login-error').innerText = "Credenciais inválidas.";
            });
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            if(el) el.classList.add('active');
        }

        function conectarFirebase() {
            if (!auth.currentUser) return;
            auth.currentUser.getIdToken().then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { cache: 'no-store' })
                .then(res => res.json()).then(data => {
                    if(data) { dadosApp = data; atualizarInterface(); }
                });
            });
            setTimeout(conectarFirebase, 5000);
        }

        function processar() {
            const input = document.getElementById('input-val');
            let v = parseFloat(input.value);
            if(isNaN(v) || v === 0) return;

            if(currentMode === 'remove') {
                const saldoAtual = currentUser === 'Gabriel' ? (dadosApp.saldoG || 0) : (dadosApp.saldoF || 0);
                if(v > saldoAtual) { alert("Saldo insuficiente!"); return; }
                v = -v;
            }

            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;

            if(currentUser === 'Gabriel') dadosApp.saldoG += v; else dadosApp.saldoF += v;
            if(!dadosApp.historico) dadosApp.historico = [];
            dadosApp.historico.unshift({ user: currentUser, val: v, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            salvar();
        }

        function togglePandora(index) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const pos = dadosApp.pandora.indexOf(index);
            if(pos > -1) dadosApp.pandora.splice(pos, 1); else dadosApp.pandora.push(index);
            salvar();
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) })
                .then(() => { atualizarInterface(); hideModal(); document.getElementById('btn-confirmar').disabled = false; });
            });
        }

        function atualizarInterface() {
            document.getElementById('val-g').innerText = (dadosApp.saldoG || 0).toLocaleString('pt-BR');
            document.getElementById('val-f').innerText = (dadosApp.saldoF || 0).toLocaleString('pt-BR');
            document.getElementById('total').innerText = 'R$ ' + ((dadosApp.saldoG || 0) + (dadosApp.saldoF || 0)).toLocaleString('pt-BR');
            
            document.getElementById('bar-g').style.width = Math.min(((dadosApp.saldoG || 0)/50000 * 100), 100) + '%';
            document.getElementById('bar-f').style.width = Math.min(((dadosApp.saldoF || 0)/50000 * 100), 100) + '%';

            const container = document.getElementById('grid-container');
            let totalPandora = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const isPainted = (dadosApp.pandora || []).includes(i);
                if(isPainted) totalPandora += v;
                return `<div class="p-item ${isPainted ? 'active' : ''}" onclick="togglePandora(${i})">${v}</div>`;
            }).join('');

            document.getElementById('pandora-bar').style.width = (totalPandora / 5000 * 100) + '%';
            document.getElementById('pandora-status').innerText = `R$ ${totalPandora.toLocaleString('pt-BR')}`;
            
            document.getElementById('activity-log').innerHTML = (dadosApp.historico || []).slice(0,5).map(i => `
                <div class="log-item" style="border-color: ${i.user === 'Gabriel' ? 'var(--secondary)' : 'var(--primary)'}">
                    <div style="font-size:0.75rem">
                        <b>${i.user}</b> <br>
                        <small style="color:#b2bec3">${i.date}</small>
                    </div>
                    <div style="font-weight:700; color:${i.val > 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${i.val > 0 ? '+' : '-'} R$ ${Math.abs(i.val).toLocaleString('pt-BR')}
                    </div>
                </div>
            `).join('');
        }

        function showModal(mode) { 
            currentMode = mode;
            document.getElementById('modal-title').innerText = mode === 'remove' ? "Demolir 🔨" : "Construir 🧱";
            document.getElementById('modal').style.display = 'flex'; 
            document.getElementById('input-val').value = '';
            document.getElementById('input-val').focus();
        }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
