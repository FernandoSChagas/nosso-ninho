<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Premium</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --ninho-gold: #fbb000;
            --ninho-bg: #f9f9f7;
            --text-main: #1a1a1a;
            --text-muted: #6e6e73;
            --success-green: #34c759;
            --danger-red: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; letter-spacing: -0.01em; }
        body { background: var(--ninho-bg); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: var(--text-main); }

        #splash-screen { position: absolute; inset: 0; z-index: 9000; background: var(--ninho-bg); display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        #login-screen { position: absolute; inset: 0; z-index: 5000; background: white; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }

        .app-shell { width: 100%; max-width: 420px; height: 100dvh; background: var(--ninho-bg); display: flex; flex-direction: column; position: relative; opacity: 0; transition: opacity 0.5s ease; }

        .top-nav { padding: 45px 20px 10px; display: flex; justify-content: flex-end; align-items: center; }
        .btn-alerta { font-size: 1.5rem; cursor: pointer; background: none; border: none; }

        .tab-content { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 110px; scroll-behavior: smooth; }
        .tab-content.active { display: flex; }

        .welcome-section { padding: 10px 20px 10px; text-align: center; }
        .welcome-section h2 { font-weight: 700; font-size: 1.8rem; }
        .welcome-section b { color: var(--ninho-gold); text-transform: capitalize; }
        
        .card-saldo { margin: 0 20px 15px; padding: 20px; background: white; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); text-align: center; border: 1px solid rgba(0,0,0,0.02); }
        
        .footer-tabs { position: fixed; bottom: 0; width: 100%; height: auto; min-height: 85px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom, 20px); padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.05); z-index: 1000; }
        .tab-btn { text-align: center; color: #a1a1a6; font-size: 0.65rem; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-btn i { font-style: normal; font-size: 1.4rem; }
        .tab-btn.active { color: var(--ninho-gold); }

        #modal { position: absolute; inset: 0; z-index: 6000; background: rgba(0,0,0,0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; padding: 30px; }
        .modal-card { background: white; width: 100%; max-width: 320px; padding: 35px; border-radius: 32px; text-align: center; }
        
        #grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 10px; padding: 20px; }
        .tile { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="splash-screen"><h2 style="font-weight: 800; color: var(--ninho-gold);">nosso ninho</h2></div>

    <div id="login-screen">
        <h1 style="margin-bottom: 30px; font-weight: 800;">nosso ninho</h1>
        <input type="email" id="login-email" style="width:100%; padding:18px; margin-bottom:12px; border-radius:18px; border:1px solid #e5e5e7;" placeholder="E-mail">
        <input type="password" id="login-pass" style="width:100%; padding:18px; margin-bottom:24px; border-radius:18px; border:1px solid #e5e5e7;" placeholder="Senha">
        <button onclick="login()" style="width:100%; padding:20px; border-radius:18px; background:var(--text-main); color:white; border:none; font-weight:700;">Entrar</button>
    </div>

    <div class="app-shell" id="app-shell">
        <div class="top-nav"><button class="btn-alerta" onclick="alert('Foco no Destino! ❤️')">🔔</button></div>
        
        <div id="tab-ninho" class="tab-content active">
            <div class="welcome-section"><h2>Olá, <b id="user-name">Fernando</b> 👋</h2><p>Acelerando o nosso sonho!</p></div>
            <div class="card-saldo">
                <h2 id="total" style="font-size: 2rem; font-weight: 800;">R$ 0,00</h2>
                <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">META: R$ 100.000</p>
            </div>
            <div style="display:flex; gap:10px; padding:0 20px;">
                <button onclick="showModal('add')" style="flex:1; padding:20px; border-radius:20px; background:var(--text-main); color:white; border:none; font-weight:700;">🧱 TIJOLOS</button>
                <button onclick="showModal('remove')" style="flex:1; padding:20px; border-radius:20px; background:white; border:1px solid #eee; font-weight:700;">🔨 DEMOLIR</button>
            </div>
            <div id="activity-log" style="padding: 20px;"></div>
        </div>

        <div id="tab-pandora" class="tab-content">
            <div class="welcome-section"><h2>Cofre Pandora</h2><p>Reserva: 5.000 €</p></div>
            <div class="card-saldo">
                <h2 id="pandora-status" style="font-size: 1.8rem; font-weight: 800;">0 €</h2>
                <div id="pandora-brl" style="font-size: 0.8rem; color: var(--success-green); font-weight: 700; margin-top: 5px;">Convertendo...</div>
                <div style="height:10px; background:#f2f2f7; border-radius:10px; margin-top:15px; overflow:hidden;"><div id="pandora-progress" style="height:100%; width:0%; background:var(--success-green); transition:1s;"></div></div>
            </div>
            <div id="grid-container"></div>
        </div>

        <div id="tab-destino" class="tab-content">
            <div class="welcome-section"><h2>Nosso Destino</h2><p>Previsão de Entrega</p></div>
            <div class="card-saldo" style="text-align: left;">
                <p style="font-size: 0.8rem; color: var(--text-muted);">Ritmo de construção:</p>
                <h3 id="ritmo-diario" style="margin-bottom: 20px; font-weight: 700;">R$ 0,00 / dia</h3>
                <div style="background: #fdfaf2; padding: 25px; border-radius: 24px; text-align: center;">
                    <h2 id="data-conclusao" style="font-size: 1.7rem; font-weight: 800;">-- / -- / ----</h2>
                </div>
            </div>
        </div>

        <div class="footer-tabs">
            <div class="tab-btn active" id="btn-ninho" onclick="switchTab('ninho', this)"><i>🏠</i>NINHO</div>
            <div class="tab-btn" id="btn-pandora" onclick="switchTab('pandora', this)"><i>🎁</i>COFRE</div>
            <div class="tab-btn" id="btn-destino" onclick="switchTab('destino', this)"><i>🧭</i>DESTINO</div>
            <div class="tab-btn" onclick="logout()"><i>🧱</i>SAIR</div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-card">
            <h3 id="modal-title">Operação</h3>
            <input type="number" id="input-val" style="width:100%; border:none; border-bottom:2px solid #f2f2f7; font-size:2.4rem; text-align:center; margin:25px 0;" placeholder="0" inputmode="decimal">
            <div style="display:flex; gap:12px;">
                <button style="flex:2; padding:18px; border-radius:18px; background:var(--text-main); color:white; border:none; font-weight:700;" onclick="processar()">Confirmar</button>
                <button style="flex:1; padding:18px; border-radius:18px; background:#f2f2f7; border:none;" onclick="hideModal()">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };
        let cotacaoEuro = 6.00;

        async function buscarCotacao() {
            try {
                const res = await fetch('https://economia.awesomeapi.com.br/last/EUR-BRL');
                const data = await res.json();
                cotacaoEuro = parseFloat(data.EURBRL.bid);
                if(dadosApp) atualizarInterface();
            } catch (e) { console.log("Cotação padrão usada."); }
        }

        const rawValues = [...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20), ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)];
        const pandoraValues = rawValues.sort((a,b) => b-a);

        auth.onAuthStateChanged(user => {
            const splash = document.getElementById('splash-screen');
            const login = document.getElementById('login-screen');
            const app = document.getElementById('app-shell');
            if (user) {
                conectarFirebase().then(() => {
                    login.style.display = 'none'; app.style.opacity = '1'; splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 400);
                    buscarCotacao();
                });
            } else {
                login.style.display = 'flex'; app.style.opacity = '0'; splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 400);
            }
        });

        function login() { auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-pass').value); }
        function logout() { auth.signOut().then(() => location.reload()); }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            el.classList.add('active');
        }

        async function conectarFirebase() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`);
            const data = await res.json();
            if(data) { dadosApp = data; atualizarInterface(); }
            setTimeout(conectarFirebase, 10000);
        }

        function atualizarInterface() {
            const totalVal = (dadosApp.saldoG || 0) + (dadosApp.saldoF || 0);
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR');
            
            // Cofre Pandora
            const container = document.getElementById('grid-container'); let totalP = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const active = (dadosApp.pandora || []).includes(i); if(active) totalP += v;
                return `<div class="tile" onclick="togglePandora(${i})" style="background:${active ? 'var(--ninho-gold)' : 'white'}; color:${active ? '#fff' : '#aaa'}; border:1px solid #eee;">${v}</div>`;
            }).join('');
            document.getElementById('pandora-status').innerText = totalP.toLocaleString('pt-BR') + ' €';
            document.getElementById('pandora-brl').innerText = 'Total: R$ ' + (totalP * cotacaoEuro).toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('pandora-progress').style.width = (totalP / 5000 * 100) + '%';
        }

        function togglePandora(i) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const pos = dadosApp.pandora.indexOf(i);
            if(pos > -1) dadosApp.pandora.splice(pos, 1);
            else { dadosApp.pandora.push(i); confetti({ particleCount: 50 }); }
            atualizarInterface(); salvar();
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) });
            });
        }

        function showModal(mode) { currentMode = mode; document.getElementById('modal').style.display = 'flex'; }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
        
        function processar() {
            const v = parseFloat(document.getElementById('input-val').value);
            const user = auth.currentUser.email.includes('fernando') ? 'Fernando' : 'Gabriel';
            const valFinal = (currentMode === 'remove' ? -v : v);
            if(user === 'Gabriel') dadosApp.saldoG += valFinal; else dadosApp.saldoF += valFinal;
            if(valFinal > 0) confetti({ particleCount: 100 });
            atualizarInterface(); salvar(); hideModal();
        }
    </script>
</body>
</html>
