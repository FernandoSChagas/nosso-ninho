<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Glass</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&family=Outfit:wght@400;700;900&display=swap');

        :root {
            --glass: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --bg-gradient: linear-gradient(135deg, #c3cfe2 0%, #c3cfe2 100%);
            --ios-blue: #007aff;
            --ios-pink: #ff2d55;
            --text-dark: #1d1d1f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000') no-repeat center center fixed;
            background-size: cover;
            height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; 
        }

        .iphone-frame {
            width: 100%; max-width: 414px; height: 100dvh;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
        }

        #login-screen { position: absolute; inset: 0; z-index: 5000; background: var(--bg-gradient); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }

        .header { padding: 50px 25px 10px; }
        .header h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 900; color: var(--text-dark); }
        .header p { font-size: 0.8rem; opacity: 0.6; color: var(--text-dark); }

        /* GAUGE CHART STYLE */
        .chart-container { position: relative; width: 180px; height: 100px; margin: 0 auto; display: flex; justify-content: center; align-items: flex-end; }
        .gauge-svg { width: 100%; height: 100%; transform: rotate(-180deg); }
        .gauge-bg { fill: none; stroke: rgba(0,0,0,0.05); stroke-width: 12; stroke-linecap: round; }
        .gauge-fill { fill: none; stroke: var(--ios-blue); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 251; stroke-dashoffset: 251; transition: stroke-dashoffset 1.5s ease-out; }
        .gauge-text { position: absolute; bottom: 0; font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--text-dark); }

        /* CARDS */
        .glass-card {
            margin: 15px 20px; padding: 20px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
        }

        .user-grid { display: flex; gap: 15px; padding: 0 20px; }
        .u-card { flex: 1; padding: 15px; background: var(--glass); border-radius: 24px; border: 1px solid var(--glass-border); text-align: center; }
        .u-card img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; margin-bottom: 5px; }
        .u-card p { font-size: 0.65rem; font-weight: 700; opacity: 0.5; text-transform: uppercase; }
        .u-card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 5px; }

        /* CDI BOX */
        .cdi-pill { display: inline-flex; align-items: center; background: rgba(0,0,0,0.05); padding: 5px 12px; border-radius: 12px; margin-top: 10px; font-size: 0.7rem; font-weight: 600; }

        /* BUTTONS */
        .actions { padding: 20px; display: flex; gap: 10px; margin-top: auto; padding-bottom: 100px; }
        .btn { flex: 1; padding: 18px; border-radius: 18px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-add { background: var(--text-dark); color: white; }
        .btn-sub { background: rgba(255,255,255,0.8); color: var(--text-dark); }

        /* NAV BAR */
        .tab-bar { position: absolute; bottom: 0; width: 100%; height: 85px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding-bottom: 25px; align-items: center; border-top: 1px solid var(--glass-border); }
        .tab-item { font-size: 0.65rem; font-weight: 700; color: #8e8e93; text-align: center; }
        .tab-item.active { color: var(--ios-blue); }

        /* PANDORA GRID */
        .pandora-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 20px; }
        .tile { aspect-ratio: 1; background: rgba(255,255,255,0.3); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: rgba(0,0,0,0.2); cursor: pointer; }
        .tile.active { background: var(--ios-blue); color: white; }

        #modal { position: absolute; inset: 0; z-index: 6000; background: rgba(0,0,0,0.3); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; padding: 30px; }
        .modal-glass { background: white; width: 100%; padding: 30px; border-radius: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .input-glass { width: 100%; border: none; border-bottom: 2px solid #eee; padding: 15px; font-size: 2rem; text-align: center; margin-bottom: 30px; outline: none; }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <div id="login-screen">
            <h1 style="font-family:'Outfit';">Nosso Ninho</h1>
            <p style="margin-bottom:30px;">Acesse para construir.</p>
            <input type="email" id="login-email" class="btn btn-sub" style="width:100%; margin-bottom:10px; text-align:left;" placeholder="E-mail">
            <input type="password" id="login-pass" class="btn btn-sub" style="width:100%; margin-bottom:20px; text-align:left;" placeholder="Senha">
            <button class="btn btn-add" style="width:100%" onclick="login()">Entrar</button>
        </div>

        <div id="tab-ninho" class="tab-content active" style="display:flex; flex-direction:column; height:100%;">
            <div class="header">
                <p id="welcome-msg">Olá!</p>
                <h1>Nossa Meta 100K</h1>
            </div>

            <div class="glass-card">
                <div class="chart-container">
                    <svg class="gauge-svg" viewBox="0 0 100 50">
                        <path class="gauge-bg" d="M10,45 A35,35 0 0,1 90,45" />
                        <path id="global-gauge" class="gauge-fill" d="M10,45 A35,35 0 0,1 90,45" />
                    </svg>
                    <div id="global-perc" class="gauge-text">0%</div>
                </div>
                <h2 id="total" style="font-family:'Outfit'; margin-top:5px;">R$ 0,00</h2>
                <div class="cdi-pill">📈 + R$ <span id="cdi-val">0,00</span> (115% CDI)</div>
            </div>

            <div class="user-grid">
                <div class="u-card">
                    <img src="foto-gabriel.png">
                    <p>Gabriel</p>
                    <h3 id="val-g">0</h3>
                    <div class="chart-container" style="width: 80px; height: 45px;">
                        <svg class="gauge-svg" viewBox="0 0 100 50">
                            <path class="gauge-bg" d="M10,45 A35,35 0 0,1 90,45" />
                            <path id="gauge-g" class="gauge-fill" style="stroke: var(--ios-blue)" d="M10,45 A35,35 0 0,1 90,45" />
                        </svg>
                    </div>
                </div>
                <div class="u-card">
                    <img src="foto-fernando.png">
                    <p>Fernando</p>
                    <h3 id="val-f">0</h3>
                    <div class="chart-container" style="width: 80px; height: 45px;">
                        <svg class="gauge-svg" viewBox="0 0 100 50">
                            <path class="gauge-bg" d="M10,45 A35,35 0 0,1 90,45" />
                            <path id="gauge-f" class="gauge-fill" style="stroke: var(--ios-pink)" d="M10,45 A35,35 0 0,1 90,45" />
                        </svg>
                    </div>
                </div>
            </div>

            <div id="activity-log" style="flex:1; padding:10px 25px; overflow-y:auto; margin-top:10px;"></div>

            <div class="actions">
                <button class="btn btn-add" onclick="showModal('add')">CONSTRUIR</button>
                <button class="btn btn-sub" onclick="showModal('remove')">DEMOLIR</button>
            </div>
        </div>

        <div id="tab-pandora" class="tab-content" style="display:none; flex-direction:column; height:100%;">
            <div class="header">
                <p>PROJETO ESPECIAL</p>
                <h1>Caixa Pandora 🎁</h1>
            </div>
            <div class="glass-card">
                <h2 id="pandora-status">R$ 0</h2>
                <p style="font-size:0.7rem; opacity:0.5;">META 5K</p>
            </div>
            <div id="grid-container" class="pandora-grid"></div>
        </div>

        <div class="tab-bar">
            <div class="tab-item active" id="nav-ninho" onclick="switchTab('ninho', this)">🏠 NINHO</div>
            <div class="tab-item" id="nav-pandora" onclick="switchTab('pandora', this)">🎁 PANDORA</div>
            <div class="tab-item" onclick="logout()">🚪 SAIR</div>
        </div>

        <div id="modal">
            <div class="modal-glass">
                <h3 id="modal-title">Operação</h3>
                <input type="number" id="input-val" class="input-glass" placeholder="0">
                <div style="display:flex; gap:12px;">
                    <button class="btn btn-add" style="flex:2" onclick="processar()" id="btn-confirmar">CONFIRMAR</button>
                    <button class="btn btn-sub" style="flex:1" onclick="hideModal()">VOLTAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentMode = 'add'; 

        const rawValues = [...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20), ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)];
        const pandoraValues = rawValues.sort(() => 0.5 - Math.random());

        let currentUser = null;
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                currentUser = user.email.toLowerCase().includes('fernando') ? 'Fernando' : 'Gabriel';
                document.getElementById('welcome-msg').innerText = `Bem-vindo, ${currentUser}!`;
                conectarFirebase();
            } else { document.getElementById('login-screen').style.display = 'flex'; }
        });

        function login() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(() => alert("Erro no login"));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            if(el) el.classList.add('active');
        }

        function conectarFirebase() {
            if (!auth.currentUser) return;
            auth.currentUser.getIdToken().then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { cache: 'no-store' })
                .then(res => res.json()).then(data => { if(data) { dadosApp = data; atualizarInterface(); } });
            });
            setTimeout(conectarFirebase, 5000);
        }

        function setGauge(id, percent) {
            const path = document.getElementById(id);
            const dash = 251 - (251 * (Math.min(percent, 100) / 100));
            path.style.strokeDashoffset = dash;
        }

        function processar() {
            const input = document.getElementById('input-val');
            let v = parseFloat(input.value);
            if(isNaN(v) || v === 0) return;

            if(currentMode === 'remove') {
                const saldoAtual = currentUser === 'Gabriel' ? (dadosApp.saldoG || 0) : (dadosApp.saldoF || 0);
                if(v > saldoAtual) { alert("Saldo insuficiente."); return; }
                v = -v;
            } else {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#007aff', '#ff2d55'] });
            }

            if(currentUser === 'Gabriel') dadosApp.saldoG += v; else dadosApp.saldoF += v;
            if(!dadosApp.historico) dadosApp.historico = [];
            dadosApp.historico.unshift({ user: currentUser, val: v, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            salvar();
        }

        function togglePandora(index) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const pos = dadosApp.pandora.indexOf(index);
            if(pos > -1) dadosApp.pandora.splice(pos, 1); else dadosApp.pandora.push(index);
            salvar();
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) })
                .then(() => { atualizarInterface(); hideModal(); });
            });
        }

        function atualizarInterface() {
            const sG = dadosApp.saldoG || 0;
            const sF = dadosApp.saldoF || 0;
            const totalVal = sG + sF;
            
            document.getElementById('val-g').innerText = `R$ ${sG.toLocaleString('pt-BR')}`;
            document.getElementById('val-f').innerText = `R$ ${sF.toLocaleString('pt-BR')}`;
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR');
            document.getElementById('cdi-val').innerText = (totalVal * 0.0095).toLocaleString('pt-BR');
            
            // Ativa os gráficos de arco
            const percGlobal = (totalVal / 100000 * 100);
            document.getElementById('global-perc').innerText = Math.floor(percGlobal) + '%';
            setGauge('global-gauge', percGlobal);
            setGauge('gauge-g', (sG / 50000 * 100));
            setGauge('gauge-f', (sF / 50000 * 100));

            const container = document.getElementById('grid-container');
            let totalP = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const active = (dadosApp.pandora || []).includes(i);
                if(active) totalP += v;
                return `<div class="tile ${active ? 'active' : ''}" onclick="togglePandora(${i})">${v}</div>`;
            }).join('');

            document.getElementById('pandora-status').innerText = `R$ ${totalP.toLocaleString('pt-BR')}`;
            
            document.getElementById('activity-log').innerHTML = (dadosApp.historico || []).slice(0,5).map(i => `
                <div style="padding:12px; background:rgba(0,0,0,0.03); border-radius:15px; margin-bottom:8px; display:flex; justify-content:space-between; font-size:0.75rem;">
                    <span><b>${i.user.toUpperCase()}</b><br><small opacity="0.5">${i.date}</small></span>
                    <b style="color:${i.val > 0 ? 'var(--ios-blue)' : 'var(--ios-pink)'}">${i.val > 0 ? '＋' : '－'} ${Math.abs(i.val).toLocaleString('pt-BR')}</b>
                </div>
            `).join('');
        }

        function showModal(mode) { 
            currentMode = mode;
            document.getElementById('modal-title').innerText = mode === 'remove' ? "DEMOLIR TIJOLO" : "CONSTRUIR TIJOLO";
            document.getElementById('modal').style.display = 'flex'; 
            document.getElementById('input-val').value = '';
            document.getElementById('input-val').focus();
        }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
