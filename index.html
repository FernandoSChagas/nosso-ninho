<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Cloud</title>
    <!-- Ícone para a tela de início do iPhone (iOS) -->
<link rel="apple-touch-icon" href="logo.png">

<!-- Ícone para navegadores e Android -->
<link rel="icon" type="image/png" href="logo.png">

<!-- Melhora a aparência de "App" no iPhone 17 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nosso Ninho">
    <!-- Firebase SDKs (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #dcf0ff 0%, #ffeaf2 100%);
            --glass: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --primary-pink: #ffafcc;
            --primary-blue: #a2d2ff;
            --text-dark: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-gradient);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .iphone-frame {
            width: 100%;
            max-width: 380px;
            height: 94dvh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 35px;
            border: 2px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            position: relative;
        }

        /* TELA DE LOGIN */
        #login-screen {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: var(--bg-gradient); z-index: 500; border-radius: 35px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }

        .login-input {
            width: 100%; padding: 15px; margin-bottom: 10px;
            border-radius: 15px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.5); font-size: 1rem;
        }

        /* DASHBOARD */
        .header { text-align: left; margin-bottom: 10px; flex-shrink: 0; }
        .header h1 { font-size: 1.2rem; color: var(--text-dark); }
        .header p { font-size: 0.75rem; opacity: 0.7; }

        .users-row { display: flex; gap: 10px; margin-bottom: 12px; flex-shrink: 0; }
        .user-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 8px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .mini-progress { background: rgba(0,0,0,0.05); height: 5px; border-radius: 10px; margin: 5px 0; overflow: hidden; }
        .fill { height: 100%; transition: width 1s; width: 0%; }

        .main-content { 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 0;
            justify-content: space-between;
        }

        .balance-display {
            text-align: center;
            background: rgba(255,255,255,0.3);
            padding: 8px;
            border-radius: 18px;
            width: 100%;
        }
        .balance-display h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text-dark); }

        .house-art { height: 80px; margin: 5px 0; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .recent-activity {
            width: 100%;
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
            margin-bottom: 10px;
        }

        .activity-item {
            font-size: 0.65rem;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }

        .btn-add {
            background: linear-gradient(90deg, #ff99ac, #ffafcc);
            color: white; border: none; width: 100%; padding: 16px;
            border-radius: 18px; font-size: 1rem; font-weight: 700;
            box-shadow: 0 8px 15px rgba(255, 175, 204, 0.3);
            cursor: pointer;
        }

        #modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 85%; background: white;
            padding: 20px; border-radius: 25px; z-index: 600; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        #modal input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <!-- LOGIN -->
        <div id="login-screen">
            <h2 style="margin-bottom: 20px;">Nosso Ninho 🏠</h2>
            <input type="email" id="login-email" class="login-input" placeholder="E-mail">
            <input type="password" id="login-pass" class="login-input" placeholder="Senha">
            <button class="btn-add" onclick="login()">Entrar</button>
            <p id="login-error" style="color:red; font-size:0.7rem; margin-top:10px;"></p>
        </div>

        <div class="header">
            <h1 id="welcome-msg">Carregando...</h1>
            <p>Construindo nosso sonho juntos ✨</p>
        </div>

        <div class="users-row">
            <div class="user-card">
                <div style="font-size:0.8rem; font-weight:bold; color:var(--primary-blue)">Gabriel</div>
                <div class="mini-progress"><div id="bar-g" class="fill" style="background:var(--primary-blue)"></div></div>
                <p style="font-size: 0.6rem;">R$ <span id="val-g">0</span></p>
            </div>
            <div class="user-card">
                <div style="font-size:0.8rem; font-weight:bold; color:var(--primary-pink)">Fernando</div>
                <div class="mini-progress"><div id="bar-f" class="fill" style="background:var(--primary-pink)"></div></div>
                <p style="font-size: 0.6rem;">R$ <span id="val-f">0</span></p>
            </div>
        </div>

        <div class="main-content">
            <div class="balance-display">
                <span>Total Construído</span>
                <h2 id="total">R$ 0</h2>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/619/619153.png" class="house-art">
            <div class="recent-activity" id="activity-log"></div>
            <button class="btn-add" onclick="showModal()">+ Adicionar Tijolinho</button>
            <button onclick="logout()" style="background:none; border:none; font-size:0.6rem; margin-top:5px; opacity:0.5;">Sair</button>
        </div>
        
        <div id="modal">
            <h3>Novo Tijolinho</h3>
            <input type="number" id="input-val" placeholder="Valor (R$)">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="processar()" style="flex:1; background:var(--primary-blue); color:white; border:none; padding:12px; border-radius:12px; font-weight:600;">Confirmar</button>
                <button onclick="hideModal()" style="flex:1; background:#eee; border:none; padding:12px; border-radius:12px;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO REAL DO SEU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const DB_URL = firebaseConfig.databaseURL + ".json";

        let currentUser = null;
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [] };

        // MONITORAR LOGIN
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                const email = user.email.toLowerCase();
                // Identifica quem logou pelo e-mail cadastrado
                currentUser = email.includes('fernando') ? 'Fernando' : 'Gabriel';
                document.getElementById('welcome-msg').innerText = `Ninho do ${currentUser}`;
                conectarFirebase();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        function login() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => {
                document.getElementById('login-error').innerText = "Erro ao entrar. Verifique e-mail e senha.";
            });
        }

        function logout() { auth.signOut(); }

        function conectarFirebase() {
            fetch(DB_URL).then(res => res.json()).then(data => {
                if(data) { dadosApp = data; atualizarInterface(); }
            });
            setTimeout(conectarFirebase, 3000); 
        }

        function processar() {
            const v = parseFloat(document.getElementById('input-val').value);
            if(isNaN(v)) return;
            if(currentUser === 'Gabriel') dadosApp.saldoG += v; else dadosApp.saldoF += v;
            
            const log = { 
                user: currentUser, 
                val: v, 
                date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            };
            
            if(!dadosApp.historico) dadosApp.historico = [];
            dadosApp.historico.unshift(log);
            if(dadosApp.historico.length > 20) dadosApp.historico.pop();
            
            fetch(DB_URL, { method: 'PUT', body: JSON.stringify(dadosApp) }).then(() => {
                atualizarInterface(); hideModal(); document.getElementById('input-val').value = '';
            });
        }

        function atualizarInterface() {
            document.getElementById('val-g').innerText = (dadosApp.saldoG || 0).toLocaleString('pt-BR');
            document.getElementById('val-f').innerText = (dadosApp.saldoF || 0).toLocaleString('pt-BR');
            document.getElementById('bar-g').style.width = Math.min(((dadosApp.saldoG || 0)/50000 * 100), 100) + '%';
            document.getElementById('bar-f').style.width = Math.min(((dadosApp.saldoF || 0)/50000 * 100), 100) + '%';
            document.getElementById('total').innerText = 'R$ ' + ((dadosApp.saldoG || 0) + (dadosApp.saldoF || 0)).toLocaleString('pt-BR');
            
            const logDiv = document.getElementById('activity-log');
            logDiv.innerHTML = (dadosApp.historico || []).map(item => `
                <div class="activity-item">
                    <span><strong>${item.user}</strong> ${item.val > 0 ? 'adicionou' : 'removeu'} R$ ${Math.abs(item.val).toLocaleString('pt-BR')}</span>
                    <span style="opacity:0.5">${item.date}</span>
                </div>
            `).join('');
        }

        function showModal() { document.getElementById('modal').style.display = 'block'; }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
