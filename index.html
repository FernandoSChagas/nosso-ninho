<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho - Invest</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        :root {
            --bg: #ffffff;
            --surface: #f9f9f9;
            --primary: #1a1a1a; /* Grafite Profundo */
            --gold: #d4af37; /* Champanhe Gold */
            --danger: #9e2a2b;
            --text-main: #1a1a1a;
            --text-muted: #8e8e93;
            --border: #eeeeee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: var(--text-main); }

        .app-container {
            width: 100%; max-width: 414px; height: 100dvh;
            background: var(--bg); position: relative;
            display: flex; flex-direction: column;
        }

        /* LOGIN PREMIUN */
        #login-screen {
            position: absolute; inset: 0; z-index: 5000;
            background: var(--bg); display: none; flex-direction: column; 
            align-items: center; justify-content: center; padding: 40px;
        }
        .login-box { width: 100%; text-align: center; }
        .login-box h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 40px; }

        /* DASHBOARD */
        .header { padding: 50px 25px 20px; }
        .header p { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 5px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-style: italic; }

        /* CARD DE SALDO ESTILO BANCO */
        .balance-card {
            margin: 0 25px; padding: 40px 25px;
            background: var(--primary); border-radius: 30px;
            color: #fff; position: relative; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .balance-card::after {
            content: ''; position: absolute; top: -50%; right: -20%;
            width: 200px; height: 200px; background: rgba(255,255,255,0.03); border-radius: 50%;
        }
        .balance-card span { font-size: 0.7rem; letter-spacing: 1.5px; opacity: 0.6; }
        .balance-card h2 { font-size: 2.5rem; margin: 10px 0; font-weight: 700; letter-spacing: -1px; }

        /* USUÁRIOS PREMIUM */
        .users-row { display: flex; gap: 20px; padding: 30px 25px; }
        .u-box { flex: 1; text-align: center; }
        .avatar-wrap { 
            width: 60px; height: 60px; border-radius: 50%; 
            margin: 0 auto 10px; padding: 3px; border: 1px solid var(--border);
        }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: grayscale(100%); transition: 0.5s; }
        .u-box:hover .avatar { filter: grayscale(0%); }
        .u-box p { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
        
        .progress-line { width: 100%; height: 2px; background: #eee; position: relative; margin-top: 10px; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--gold); transition: width 1.5s ease; }

        /* ATIVIDADES */
        .log-section { flex: 1; padding: 10px 25px; overflow-y: auto; }
        .log-item {
            padding: 15px 0; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .log-info b { font-size: 0.85rem; font-weight: 600; display: block; }
        .log-info small { color: var(--text-muted); font-size: 0.7rem; }
        .log-val { font-weight: 700; font-size: 0.9rem; }

        /* BOTÕES FLUTUANTES */
        .nav-actions {
            padding: 20px 25px 100px; display: flex; gap: 15px;
        }
        .btn-premium {
            flex: 1; padding: 18px; border-radius: 15px; border: none;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-dark { background: var(--primary); color: white; }
        .btn-light { background: var(--surface); color: var(--primary); border: 1px solid var(--border); }

        /* TAB BAR MÍNIMA */
        .tab-bar {
            position: absolute; bottom: 0; width: 100%; height: 85px;
            background: #fff; border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding-bottom: 25px; align-items: center;
        }
        .tab-btn { text-align: center; color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .tab-btn.active { color: var(--gold); }
        .tab-btn i { display: block; font-size: 1.2rem; margin-bottom: 5px; font-style: normal; }

        /* CAIXA DE PANDORA - GRID LUXO */
        .pandora-grid {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; padding: 20px 25px;
        }
        .cell {
            aspect-ratio: 1; border: 1px solid var(--border); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem; color: #ccc; transition: 0.4s;
        }
        .cell.active { background: var(--primary); color: var(--gold); border-color: var(--primary); }

        /* MODAL */
        #modal {
            display: none; position: absolute; inset: 0; z-index: 6000;
            background: rgba(255,255,255,0.95); align-items: center; justify-content: center; padding: 40px;
        }
        .modal-body { width: 100%; text-align: center; }
        .modal-body h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 30px; }
        .input-premium {
            width: 100%; border: none; border-bottom: 2px solid var(--primary);
            padding: 15px; font-size: 2rem; text-align: center; margin-bottom: 40px;
            background: transparent; outline: none; font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- LOGIN -->
        <div id="login-screen">
            <div class="login-box">
                <h1>Ninho<br><i>Private</i></h1>
                <input type="email" id="login-email" class="btn-premium btn-light" style="width:100%; margin-bottom:10px; text-align:center; text-transform:none;" placeholder="E-mail de acesso">
                <input type="password" id="login-pass" class="btn-premium btn-light" style="width:100%; margin-bottom:20px; text-align:center; text-transform:none;" placeholder="Senha">
                <button class="btn-premium btn-dark" style="width:100%" onclick="login()">Entrar no Cofre</button>
                <p id="login-error" style="color:var(--danger); font-size:0.7rem; margin-top:20px;"></p>
            </div>
        </div>

        <!-- NINHO TAB -->
        <div id="tab-ninho" class="tab-content active" style="display:flex; flex-direction:column; height:100%;">
            <div class="header">
                <p id="welcome-msg">Autenticando...</p>
                <h1>Resumo Patrimonial</h1>
            </div>

            <div class="balance-card">
                <span>VALOR TOTAL ACUMULADO</span>
                <h2 id="total">R$ 0,00</h2>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="opacity:0.4">ESTRATÉGIA 100K</span>
                    <span id="global-perc" style="color:var(--gold)">0%</span>
                </div>
            </div>

            <div class="users-row">
                <div class="u-box">
                    <div class="avatar-wrap"><img src="foto-gabriel.png" class="avatar"></div>
                    <p>Gabriel</p>
                    <small style="color:var(--gold); font-weight:700;">R$ <span id="val-g">0</span></small>
                    <div class="progress-line"><div id="bar-g" class="progress-fill"></div></div>
                </div>
                <div class="u-box">
                    <div class="avatar-wrap"><img src="foto-fernando.png" class="avatar"></div>
                    <p>Fernando</p>
                    <small style="color:var(--gold); font-weight:700;">R$ <span id="val-f">0</span></small>
                    <div class="progress-line"><div id="bar-f" class="progress-fill"></div></div>
                </div>
            </div>

            <div class="log-section">
                <p style="font-size:0.6rem; letter-spacing:1px; color:var(--text-muted); margin-bottom:10px;">HISTÓRICO DE APORTES</p>
                <div id="activity-log"></div>
            </div>

            <div class="nav-actions">
                <button class="btn-premium btn-dark" onclick="showModal('add')">Aportar ＋</button>
                <button class="btn-premium btn-light" onclick="showModal('remove')">Retirar －</button>
            </div>
        </div>

        <!-- PANDORA TAB -->
        <div id="tab-pandora" class="tab-content" style="display:none; flex-direction:column; height:100%;">
            <div class="header">
                <p>PROJETO ESPECIAL</p>
                <h1>Caixa Pandora</h1>
            </div>
            <div style="margin: 0 25px 20px; background:var(--surface); padding:25px; border-radius:20px; border:1px solid var(--border);">
                <span style="font-size:0.6rem; color:var(--text-muted);">CAPITAL CONSOLIDADO</span>
                <h2 id="pandora-status" style="font-size:1.8rem; margin:5px 0;">R$ 0</h2>
                <div class="progress-line" style="height:4px;"><div id="pandora-bar" class="progress-fill"></div></div>
            </div>
            <div id="grid-container" class="pandora-grid"></div>
        </div>

        <!-- TAB BAR -->
        <div class="tab-bar">
            <div class="tab-btn active" id="nav-ninho" onclick="switchTab('ninho', this)"><i>◆</i>Ninho</div>
            <div class="tab-btn" id="nav-pandora" onclick="switchTab('pandora', this)"><i>◇</i>Pandora</div>
            <div class="tab-btn" onclick="logout()"><i>×</i>Sair</div>
        </div>

        <!-- MODAL -->
        <div id="modal">
            <div class="modal-body">
                <h3 id="modal-title">Inserir Valor</h3>
                <input type="number" id="input-val" class="input-premium" placeholder="0">
                <div style="display:flex; gap:15px;">
                    <button class="btn-premium btn-dark" style="flex:2" onclick="processar()" id="btn-confirmar">Confirmar</button>
                    <button class="btn-premium btn-light" style="flex:1" onclick="hideModal()">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentMode = 'add'; 

        const rawValues = [
            ...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20),
            ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)
        ];
        const pandoraValues = rawValues.sort(() => 0.5 - Math.random());

        let currentUser = null;
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                currentUser = user.email.toLowerCase().includes('fernando') ? 'Fernando' : 'Gabriel';
                document.getElementById('welcome-msg').innerText = `CONTA: ${currentUser}`;
                conectarFirebase();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        function login() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            if(!e || !p) return;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert("Acesso Negado."));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            if(el) el.classList.add('active');
        }

        function conectarFirebase() {
            if (!auth.currentUser) return;
            auth.currentUser.getIdToken().then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { cache: 'no-store' })
                .then(res => res.json()).then(data => {
                    if(data) { dadosApp = data; atualizarInterface(); }
                });
            });
            setTimeout(conectarFirebase, 5000);
        }

        function processar() {
            const input = document.getElementById('input-val');
            let v = parseFloat(input.value);
            if(isNaN(v) || v === 0) return;

            if(currentMode === 'remove') {
                const saldoAtual = currentUser === 'Gabriel' ? (dadosApp.saldoG || 0) : (dadosApp.saldoF || 0);
                if(v > saldoAtual) { alert("Saldo Insuficiente."); return; }
                v = -v;
            }

            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;

            if(currentUser === 'Gabriel') dadosApp.saldoG += v; else dadosApp.saldoF += v;
            if(!dadosApp.historico) dadosApp.historico = [];
            dadosApp.historico.unshift({ user: currentUser, val: v, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            salvar();
        }

        function togglePandora(index) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const pos = dadosApp.pandora.indexOf(index);
            if(pos > -1) dadosApp.pandora.splice(pos, 1); else dadosApp.pandora.push(index);
            salvar();
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) })
                .then(() => { atualizarInterface(); hideModal(); document.getElementById('btn-confirmar').disabled = false; });
            });
        }

        function atualizarInterface() {
            const totalVal = (dadosApp.saldoG || 0) + (dadosApp.saldoF || 0);
            document.getElementById('val-g').innerText = (dadosApp.saldoG || 0).toLocaleString('pt-BR');
            document.getElementById('val-f').innerText = (dadosApp.saldoF || 0).toLocaleString('pt-BR');
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR');
            document.getElementById('global-perc').innerText = Math.min((totalVal / 100000 * 100), 100).toFixed(1) + '%';
            
            document.getElementById('bar-g').style.width = Math.min(((dadosApp.saldoG || 0)/50000 * 100), 100) + '%';
            document.getElementById('bar-f').style.width = Math.min(((dadosApp.saldoF || 0)/50000 * 100), 100) + '%';

            const container = document.getElementById('grid-container');
            let totalP = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const active = (dadosApp.pandora || []).includes(i);
                if(active) totalP += v;
                return `<div class="cell ${active ? 'active' : ''}" onclick="togglePandora(${i})">${v}</div>`;
            }).join('');

            document.getElementById('pandora-bar').style.width = (totalP / 5000 * 100) + '%';
            document.getElementById('pandora-status').innerText = `R$ ${totalP.toLocaleString('pt-BR')}`;
            
            document.getElementById('activity-log').innerHTML = (dadosApp.historico || []).slice(0,5).map(i => `
                <div class="log-item">
                    <div class="log-info">
                        <b>${i.user.toUpperCase()}</b>
                        <small>${i.date}</small>
                    </div>
                    <div class="log-val" style="color:${i.val > 0 ? 'var(--gold)' : 'var(--danger)'}">
                        ${i.val > 0 ? '＋' : '－'} ${Math.abs(i.val).toLocaleString('pt-BR')}
                    </div>
                </div>
            `).join('');
        }

        function showModal(mode) { 
            currentMode = mode;
            document.getElementById('modal-title').innerText = mode === 'remove' ? "Retirar Capital" : "Aporte de Capital";
            document.getElementById('modal').style.display = 'flex'; 
            document.getElementById('input-val').value = '';
            document.getElementById('input-val').focus();
        }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
