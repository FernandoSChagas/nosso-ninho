<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nosso Ninho</title>
    
    <!-- Configurações para WebApp no iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --ninho-gold: #fbb000;
            --ninho-bg: #f9f9f7;
            --text-main: #1a1a1a;
            --text-muted: #6e6e73;
            --success-green: #34c759;
            --danger-red: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            background: var(--ninho-bg); 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            position: fixed; /* Evita scrolls fantasmas no iOS */
        }

        /* TELA DE LOGIN - PRIORIDADE MÁXIMA NO MOBILE */
        #login-screen { 
            position: fixed; 
            inset: 0; 
            z-index: 9999; 
            background: white; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 30px; 
        }

        #login-screen h1 { font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }

        input {
            width: 100%; 
            padding: 18px; 
            margin-bottom: 12px; 
            border-radius: 16px; 
            border: 1px solid #e5e5e7; 
            font-size: 16px; /* Impede zoom automático no iPhone */
            outline: none;
            background: #f5f5f7;
        }

        .btn-entrar {
            width: 100%; 
            padding: 20px; 
            border-radius: 16px; 
            background: var(--text-main); 
            color: white; 
            border: none; 
            font-weight: 700; 
            font-size: 1rem;
            margin-top: 10px;
        }

        .app-shell { 
            width: 100%; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
        }

        /* CONTEÚDO E TABS */
        .tab-content { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 120px; padding-top: 60px; }
        .tab-content.active { display: flex; }

        .card-saldo { margin: 15px 20px; padding: 25px; background: white; border-radius: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); text-align: center; }

        .footer-tabs { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            height: 90px; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding-bottom: env(safe-area-inset-bottom); 
            border-top: 1px solid rgba(0,0,0,0.05); 
            z-index: 1000;
        }

        .tab-btn { color: #a1a1a6; font-size: 0.6rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-btn.active { color: var(--ninho-gold); }
        .nav-icon { width: 24px; height: 24px; opacity: 0.4; }
        .tab-btn.active .nav-icon { opacity: 1; filter: none; }

        #grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; padding: 20px; }
        .tile { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>nosso ninho</h1>
        <input type="email" id="login-email" placeholder="E-mail" autocomplete="email">
        <input type="password" id="login-pass" placeholder="Senha">
        <button class="btn-entrar" onclick="login()">Entrar</button>
    </div>

    <div class="app-shell" id="app-shell">
        <!-- NINHO -->
        <div id="tab-ninho" class="tab-content active">
            <div class="card-saldo">
                <h2 id="total" style="font-size: 2rem; font-weight: 800;">R$ 0,00</h2>
                <p style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); margin-top: 5px;">META: R$ 100.000</p>
            </div>
            <div style="display:flex; gap:10px; padding:0 20px;">
                <button onclick="showModal('add')" style="flex:1; padding:20px; border-radius:20px; background:var(--text-main); color:white; border:none; font-weight:700;">🧱 TIJOLOS</button>
                <button onclick="showModal('remove')" style="flex:1; padding:20px; border-radius:20px; background:white; border:1px solid #eee; font-weight:700;">🔨 DEMOLIR</button>
            </div>
            <div id="activity-log" style="padding: 20px;"></div>
        </div>

        <!-- COFRE -->
        <div id="tab-pandora" class="tab-content">
            <div class="card-saldo">
                <h2 id="pandora-status" style="font-size: 2rem; font-weight: 800;">R$ 0,00</h2>
                <p style="font-size: 0.7rem; font-weight: 700; color: var(--success-green);">COFRE PANDORA</p>
            </div>
            <div id="grid-container"></div>
        </div>

        <!-- DESTINO -->
        <div id="tab-destino" class="tab-content">
            <div class="card-saldo" style="text-align: left;">
                <p style="font-size: 0.8rem; color: var(--text-muted);">Ritmo de construção:</p>
                <h3 id="ritmo-diario" style="margin-bottom: 20px; font-weight: 700;">R$ 0,00 / dia</h3>
                <div style="background: #fdfaf2; padding: 25px; border-radius: 24px; text-align: center;">
                    <p style="font-size: 0.65rem; font-weight: 800; color: var(--ninho-gold);">PREVISÃO DE ENTREGA</p>
                    <h2 id="data-conclusao" style="font-size: 1.7rem; margin-top: 10px; font-weight: 800;">-- / -- / ----</h2>
                </div>
            </div>
        </div>

        <div class="footer-tabs">
            <div class="tab-btn active" id="btn-ninho" onclick="switchTab('ninho', this)"><img src="ninho.svg" class="nav-icon">NINHO</div>
            <div class="tab-btn" id="btn-pandora" onclick="switchTab('pandora', this)"><img src="cofre.svg" class="nav-icon">COFRE</div>
            <div class="tab-btn" id="btn-destino" onclick="switchTab('destino', this)"><img src="destino.svg" class="nav-icon">DESTINO</div>
            <div class="tab-btn" onclick="logout()"><img src="sair.svg" class="nav-icon">SAIR</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };
        
        const rawValues = [...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20), ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)];
        const pandoraValues = rawValues.sort((a,b) => b-a);

        auth.onAuthStateChanged(user => {
            const login = document.getElementById('login-screen');
            const app = document.getElementById('app-shell');
            if (user) {
                conectarFirebase().then(() => {
                    login.style.display = 'none';
                    app.style.opacity = '1';
                });
            } else {
                login.style.display = 'flex';
                app.style.opacity = '0';
            }
        });

        function login() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert("Erro: " + err.message));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        async function conectarFirebase() {
            const token = await auth.currentUser.getIdToken();
            const res = await fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`);
            const data = await res.json();
            if(data) { dadosApp = data; atualizarInterface(); }
            setTimeout(conectarFirebase, 10000);
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            el.classList.add('active');
        }

        function atualizarInterface() {
            const totalVal = (dadosApp.saldoG || 0) + (dadosApp.saldoF || 0);
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR');

            // Render Cofre
            const container = document.getElementById('grid-container');
            let totalP = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const active = (dadosApp.pandora || []).includes(i);
                if(active) totalP += v;
                return `<div class="tile" onclick="togglePandora(${i})" style="background:${active ? 'var(--ninho-gold)' : 'white'}; color:${active ? '#fff' : '#aaa'}; border:1px solid #eee;">${v}</div>`;
            }).join('');
            document.getElementById('pandora-status').innerText = 'R$ ' + totalP.toLocaleString('pt-BR');

            // Destino Logic
            const historico = dadosApp.historico || [];
            if (historico.length >= 1) {
                const partes = historico[historico.length - 1].date.split('/');
                const inicio = new Date(`${partes[2]}-${partes[1]}-${partes[0]}`);
                const dias = Math.max(1, Math.ceil(Math.abs(new Date() - inicio) / (1000 * 60 * 60 * 24)));
                const media = totalVal / dias;
                const falta = 100000 - totalVal;
                if(media > 0) {
                    const diasParaFim = Math.ceil(falta / media);
                    const dataF = new Date(); dataF.setDate(dataF.getDate() + diasParaFim);
                    document.getElementById('ritmo-diario').innerText = 'R$ ' + media.toLocaleString('pt-BR') + ' / dia';
                    document.getElementById('data-conclusao').innerText = dataF.toLocaleDateString('pt-BR');
                }
            }
        }

        function togglePandora(i) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const idx = dadosApp.pandora.indexOf(i);
            if(idx > -1) dadosApp.pandora.splice(idx, 1);
            else dadosApp.pandora.push(i);
            atualizarInterface(); salvar();
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) });
            });
        }
    </script>
</body>
</html>
