<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nossa Casa - Wallet</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg: #080a0c;
            --card-bg: #12151a;
            --primary: #c4ff00; /* Verde Limão High-Tech */
            --secondary: #22262b;
            --danger: #ff4d4d;
            --success: #00ff88;
            --text-main: #ffffff;
            --text-muted: #6a7280;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; color: var(--text-main); }

        .app-container { width: 100%; max-width: 414px; height: 100dvh; background: var(--bg); position: relative; display: flex; flex-direction: column; }

        #login-screen { position: absolute; inset: 0; z-index: 5000; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        
        /* HEADER JORNADA */
        .header { padding: 40px 25px 15px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        .header p { font-size: 0.85rem; color: var(--text-muted); }

        /* CARD PRINCIPAL - FOCO NA CASA */
        .house-wallet-card {
            margin: 0 20px; padding: 25px;
            background: linear-gradient(145deg, #1a1f26 0%, #0d1013 100%);
            border-radius: 30px; border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); position: relative;
        }
        .house-wallet-card span { font-size: 0.7rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        .house-wallet-card h2 { font-size: 2.4rem; margin: 5px 0; font-weight: 800; }
        
        /* PREVISÃO DE RENDIMENTOS */
        .forecast-box {
            margin: 15px 20px; padding: 15px 20px; background: rgba(196, 255, 0, 0.05);
            border-radius: 20px; border: 1px dashed rgba(196, 255, 0, 0.3);
            display: flex; justify-content: space-between; align-items: center;
        }
        .forecast-box div b { color: var(--primary); display: block; font-size: 1rem; }
        .forecast-box div small { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }

        /* STATUS INDIVIDUAL */
        .user-grid { display: flex; gap: 12px; padding: 10px 20px; }
        .u-pill { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 24px; border: 1px solid var(--border); text-align: center; }
        .u-pill img { width: 40px; height: 40px; border-radius: 50%; margin-bottom: 8px; border: 2px solid var(--secondary); }
        .u-pill b { display: block; font-size: 0.9rem; margin-top: 4px; }

        /* PROGRESSO DA CONSTRUÇÃO */
        .progress-container { padding: 20px 25px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; }
        .track { width: 100%; height: 8px; background: #1a1f26; border-radius: 10px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1); }

        /* BOTÕES DE AÇÃO */
        .actions-wallet { padding: 20px; display: flex; gap: 12px; margin-top: auto; padding-bottom: 100px; }
        .btn-wallet { flex: 1; padding: 20px; border-radius: 20px; border: none; font-size: 0.85rem; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 10px 25px rgba(196, 255, 0, 0.2); }
        .btn-secondary { background: var(--secondary); color: #fff; }

        /* PANDORA - GRID MINIMALISTA */
        .pandora-blueprint { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 20px; }
        .tile { aspect-ratio: 1; background: #161a1f; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; color: #333; font-weight: 700; transition: 0.3s; cursor: pointer; }
        .tile.active { background: var(--primary); color: #000; box-shadow: 0 0 12px rgba(196, 255, 0, 0.3); }

        /* TAB BAR */
        .tab-bar { position: absolute; bottom: 0; width: 100%; height: 85px; background: rgba(8, 10, 12, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; border-top: 1px solid var(--border); padding-bottom: 25px; align-items: center; }
        .tab-btn { color: #444; font-size: 0.6rem; font-weight: 800; letter-spacing: 1px; text-align: center; }
        .tab-btn.active { color: var(--primary); }

        #modal { position: absolute; inset: 0; z-index: 6000; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 30px; }
        .modal-wallet { background: var(--card-bg); width: 100%; padding: 35px; border-radius: 35px; border: 1px solid var(--border); text-align: center; }
        .input-wallet { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--primary); color: #fff; font-size: 2.5rem; text-align: center; margin: 30px 0; outline: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LOGIN -->
        <div id="login-screen">
            <h1 style="margin-bottom: 10px;">🔑 Acesso</h1>
            <p style="color:var(--text-muted); margin-bottom:30px;">Identifique-se para continuar.</p>
            <input type="email" id="login-email" class="btn-wallet btn-secondary" style="width:100%; margin-bottom:12px; text-align:left; text-transform:none;" placeholder="Seu e-mail">
            <input type="password" id="login-pass" class="btn-wallet btn-secondary" style="width:100%; margin-bottom:25px; text-align:left; text-transform:none;" placeholder="Sua senha">
            <button class="btn-wallet btn-primary" style="width:100%" onclick="login()">Desbloquear Carteira</button>
        </div>

        <!-- DASHBOARD -->
        <div id="tab-ninho" class="tab-content active" style="display:flex; flex-direction:column; height:100%;">
            <div class="header">
                <p id="welcome-msg">Carregando...</p>
                <h1>Nossa Casa 🏠</h1>
            </div>

            <div class="house-wallet-card">
                <span>Saldo Acumulado</span>
                <h2 id="total">R$ 0,00</h2>
                <div class="track" style="margin-top:15px; height:6px;"><div id="global-bar" class="bar" style="background:var(--primary)"></div></div>
            </div>

            <div class="forecast-box">
                <div>
                    <small>Previsão de Rendimento</small>
                    <b>+ R$ <span id="cdi-val">0,00</span></b>
                </div>
                <div style="text-align:right">
                    <span style="font-size:0.7rem; font-weight:800; color:var(--primary)">115% CDI</span>
                    <p style="font-size:0.5rem; color:var(--text-muted)">PROJEÇÃO 30 DIAS</p>
                </div>
            </div>

            <div class="user-grid">
                <div class="u-pill">
                    <img src="foto-gabriel.png">
                    <small style="color:var(--text-muted)">GABRIEL</small>
                    <b id="val-g">0</b>
                </div>
                <div class="u-pill">
                    <img src="foto-fernando.png">
                    <small style="color:var(--text-muted)">FERNANDO</small>
                    <b id="val-f">0</b>
                </div>
            </div>

            <div id="activity-log" style="flex:1; padding:10px 25px; overflow-y:auto;"></div>

            <div class="actions-wallet">
                <button class="btn-wallet btn-primary" onclick="showModal('add')">Investir</button>
                <button class="btn-wallet btn-secondary" onclick="showModal('remove')">Retirar</button>
            </div>
        </div>

        <!-- PANDORA -->
        <div id="tab-pandora" class="tab-content" style="display:none; flex-direction:column; height:100%;">
            <div class="header">
                <p>PROJETO ESPECIAL</p>
                <h1>Caixa Pandora 🎁</h1>
            </div>
            <div style="margin: 0 20px 10px; background:var(--card-bg); padding:20px; border-radius:24px; border:1px solid var(--border);">
                <div class="progress-label"><span>OBJETIVO CONSOLIDADO</span><span id="pandora-status">R$ 0</span></div>
                <div class="track"><div id="pandora-bar" class="bar" style="background:var(--success)"></div></div>
            </div>
            <div id="grid-container" class="pandora-blueprint"></div>
        </div>

        <!-- TABS -->
        <div class="tab-bar">
            <div class="tab-btn active" id="nav-ninho" onclick="switchTab('ninho', this)">CARTEIRA</div>
            <div class="tab-btn" id="nav-pandora" onclick="switchTab('pandora', this)">PANDORA</div>
            <div class="tab-btn" onclick="logout()">SAIR</div>
        </div>

        <!-- MODAL -->
        <div id="modal">
            <div class="modal-wallet">
                <h3 id="modal-title">Operação</h3>
                <input type="number" id="input-val" class="input-wallet" placeholder="0">
                <div style="display:flex; gap:12px;">
                    <button class="btn-wallet btn-primary" style="flex:2" onclick="processar()" id="btn-confirmar">Confirmar</button>
                    <button class="btn-wallet btn-secondary" style="flex:1" onclick="hideModal()">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2tR0r6uqStnb4YhEMoZ8p_Y6J5WzgEPk",
            authDomain: "nosso-ninho-c2ddf.firebaseapp.com",
            databaseURL: "https://nosso-ninho-c2ddf-default-rtdb.firebaseio.com/",
            projectId: "nosso-ninho-c2ddf",
            storageBucket: "nosso-ninho-c2ddf.firebasestorage.app",
            messagingSenderId: "942734057338",
            appId: "1:942734057338:web:e8c1ca635ddb7dcbe340c3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentMode = 'add'; 

        const rawValues = [...Array(10).fill(100), ...Array(20).fill(50), ...Array(60).fill(20), ...Array(80).fill(10), ...Array(100).fill(5), ...Array(20).fill(2), ...Array(10).fill(1)];
        const pandoraValues = rawValues.sort(() => 0.5 - Math.random());

        let currentUser = null;
        let dadosApp = { saldoG: 0, saldoF: 0, historico: [], pandora: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                currentUser = user.email.toLowerCase().includes('fernando') ? 'Fernando' : 'Gabriel';
                document.getElementById('welcome-msg').innerText = `CONTA: ${currentUser.toUpperCase()}`;
                conectarFirebase();
            } else { document.getElementById('login-screen').style.display = 'flex'; }
        });

        function login() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            if(!e || !p) return;
            auth.signInWithEmailAndPassword(e, p).catch(() => alert("Acesso negado."));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'flex';
            if(el) el.classList.add('active');
        }

        function conectarFirebase() {
            if (!auth.currentUser) return;
            auth.currentUser.getIdToken().then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { cache: 'no-store' })
                .then(res => res.json()).then(data => { if(data) { dadosApp = data; atualizarInterface(); } });
            });
            setTimeout(conectarFirebase, 5000);
        }

        function processar() {
            const input = document.getElementById('input-val');
            let v = parseFloat(input.value);
            if(isNaN(v) || v === 0) return;

            if(currentMode === 'remove') {
                const saldoAtual = currentUser === 'Gabriel' ? (dadosApp.saldoG || 0) : (dadosApp.saldoF || 0);
                if(v > saldoAtual) { alert("Saldo insuficiente."); return; }
                v = -v;
            } else {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#c4ff00', '#ffffff'] });
            }

            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;

            if(currentUser === 'Gabriel') dadosApp.saldoG += v; else dadosApp.saldoF += v;
            if(!dadosApp.historico) dadosApp.historico = [];
            dadosApp.historico.unshift({ user: currentUser, val: v, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            salvar();
        }

        function togglePandora(index) {
            if(!dadosApp.pandora) dadosApp.pandora = [];
            const pos = dadosApp.pandora.indexOf(index);
            if(pos > -1) dadosApp.pandora.splice(pos, 1); else {
                dadosApp.pandora.push(index);
                confetti({ particleCount: 40, scalar: 0.7, origin: { y: 0.7 }, colors: ['#00ff88'] });
            }
            salvar();
        }

        function salvar() {
            auth.currentUser.getIdToken(true).then(token => {
                fetch(`${firebaseConfig.databaseURL}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(dadosApp) })
                .then(() => { atualizarInterface(); hideModal(); document.getElementById('btn-confirmar').disabled = false; });
            });
        }

        function atualizarInterface() {
            const totalVal = (dadosApp.saldoG || 0) + (dadosApp.saldoF || 0);
            
            // CÁLCULO CDI 115% (Aprox. 0.95% ao mês líquido)
            const rendimentoEstimado = totalVal * 0.0095; 

            document.getElementById('val-g').innerText = `R$ ${(dadosApp.saldoG || 0).toLocaleString('pt-BR')}`;
            document.getElementById('val-f').innerText = `R$ ${(dadosApp.saldoF || 0).toLocaleString('pt-BR')}`;
            document.getElementById('total').innerText = 'R$ ' + totalVal.toLocaleString('pt-BR');
            document.getElementById('cdi-val').innerText = rendimentoEstimado.toLocaleString('pt-BR');
            document.getElementById('global-bar').style.width = Math.min((totalVal / 150000 * 100), 100) + '%';

            const container = document.getElementById('grid-container');
            let totalP = 0;
            container.innerHTML = pandoraValues.map((v, i) => {
                const active = (dadosApp.pandora || []).includes(i);
                if(active) totalP += v;
                return `<div class="tile ${active ? 'active' : ''}" onclick="togglePandora(${i})">${v}</div>`;
            }).join('');

            document.getElementById('pandora-bar').style.width = (totalP / 5000 * 100) + '%';
            document.getElementById('pandora-status').innerText = `R$ ${totalP.toLocaleString('pt-BR')}`;
            
            document.getElementById('activity-log').innerHTML = (dadosApp.historico || []).slice(0,5).map(i => `
                <div style="padding:15px; background:var(--card-bg); border-radius:18px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div><b style="font-size:0.75rem">${i.user.toUpperCase()}</b><br><small style="color:var(--text-muted)">${i.date}</small></div>
                    <div style="font-weight:800; color:${i.val > 0 ? 'var(--success)' : 'var(--danger)'}">${i.val > 0 ? '＋' : '－'} ${Math.abs(i.val).toLocaleString('pt-BR')}</div>
                </div>
            `).join('');
        }

        function showModal(mode) { 
            currentMode = mode;
            document.getElementById('modal-title').innerText = mode === 'remove' ? "RETIRAR" : "INVESTIR";
            document.getElementById('modal').style.display = 'flex'; 
            document.getElementById('input-val').value = '';
            document.getElementById('input-val').focus();
        }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
